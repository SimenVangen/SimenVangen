name: Apartments

on:
  schedule:
    - cron: "11 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: SimenVangen/git-apartments@main
        with:
          output: assets/apartments.gif

      - name: Commit the building
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apartments.gif
          if git diff --cached --quiet; then
            echo "The building hasn't changed."
          else
            git commit -m "Redraw the apartment building"
            git pull --rebase
            git push
          fi
