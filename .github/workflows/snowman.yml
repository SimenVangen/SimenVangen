name: Snowman

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: SimenVangen/git-snowman@main
        with:
          output: assets/snowman.gif

      - name: Commit the snowman
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snowman.gif
          if git diff --cached --quiet; then
            echo "The snowman hasn't changed."
          else
            git commit -m "Redraw the snowman"
            git push
          fi
